apiVersion: apps/v1
kind: Deployment
metadata:
  name: negotiateai-api
  labels:
    app: negotiateai-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: negotiateai-api
  template:
    metadata:
      labels:
        app: negotiateai-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: negotiateai-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: negotiateai-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: negotiateai-api
spec:
  selector:
    app: negotiateai-api
  ports:
    - name: http
      port: 3001
      targetPort: http
  type: ClusterIP
