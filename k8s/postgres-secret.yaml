  POSTGRES_PASSWORD: ai_negotiation_agent
  POSTGRES_DB: negotiateai
  # Must use the same user/password/db as above
  DATABASE_URL: postgres://negotiateai:ai_negotiation_agent@postgres:5432/negotiateai
